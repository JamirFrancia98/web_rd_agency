# Compila el sitio y lo sube a tu hosting por FTP. Solo se lanza a mano:
# public_html es del WordPress hasta que la migración esté aprobada y haya backup verificado.
# Configura los secretos en GitHub → Settings → Secrets and variables → Actions:
#   FTP_SERVER   (ej. ftp.revolutiondigital.agency)
#   FTP_USERNAME
#   FTP_PASSWORD
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Subir dist/ al hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./public_html/
